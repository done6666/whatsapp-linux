name: Bug report
description: Report a problem with WhatsApp Linux
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug!
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Click ...
        3. See error
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Installation method
      options:
        - deb
        - rpm
        - AppImage
        - Flatpak
        - Running from source (npm start)
    validations:
      required: true
  - type: dropdown
    id: arch
    attributes:
      label: Architecture
      options:
        - x64
        - arm64
    validations:
      required: true
  - type: dropdown
    id: desktop
    attributes:
      label: Desktop environment
      options:
        - GNOME
        - KDE Plasma
        - XFCE
        - Cinnamon
        - MATE
        - Other
    validations:
      required: true
  - type: dropdown
    id: session
    attributes:
      label: Display protocol
      options:
        - Wayland
        - X11
        - Not sure
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution and version
      placeholder: Ubuntu 26.04 LTS
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output
      description: Run the app from a terminal and paste any errors here.
      render: shell
